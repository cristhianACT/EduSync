<div class="flex h-screen bg-gray-50 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar [isOpen]="sidebarOpen"></app-sidebar>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <!-- Header -->
        <app-header [sidebarOpen]="sidebarOpen" [userName]="userName" (toggleSidebar)="toggleSidebar()"></app-header>

        <!-- Content -->
        <div class="p-8">
            <!-- Page Title -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Herramientas</h1>
                <p class="text-gray-600">Explora todas las herramientas disponibles para potenciar tu enseñanza</p>
            </div>

            <!-- Tools Section -->
            <section>
                <!-- Category Filters -->
                <app-category-filter [categories]="categories" [selectedCategory]="selectedCategory"
                    (select)="selectCategory($event)">
                </app-category-filter>

                <!-- Tools Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
                    <app-tool-card *ngFor="let tool of filteredTools" [tool]="tool"
                        (toggleFavorite)="toggleFavorite($event)">
                    </app-tool-card>
                </div>

                <!-- Empty State -->
                <div *ngIf="filteredTools.length === 0" class="text-center py-12">
                    <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                    <h3 class="text-lg font-medium text-gray-900 mb-2">No hay herramientas en esta categoría</h3>
                    <p class="text-gray-500">Intenta seleccionar otra categoría</p>
                </div>
            </section>
        </div>
    </main>
</div>
