<div class="flex h-screen bg-gray-50 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar [isOpen]="sidebarOpen" [userName]="userName"></app-sidebar>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto">
        <!-- Header -->
        <app-header [sidebarOpen]="sidebarOpen" [userName]="userName" (toggleSidebar)="toggleSidebar()"></app-header>

        <!-- Content -->
        <div class="p-8">
            <!-- Quick Actions -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div *ngFor="let action of quickActions" [class]="action.color"
                    class="p-6 rounded-xl cursor-pointer hover:shadow-lg transition-all border border-gray-200">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center shadow-sm">
                            <svg [class]="action.iconColor" class="w-6 h-6" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path *ngIf="action.icon === 'document'" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                <path *ngIf="action.icon === 'folder'" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                                <path *ngIf="action.icon === 'chat'" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                            </svg>
                        </div>
                        <h3 class="font-semibold text-gray-900">{{ action.title }}</h3>
                    </div>
                </div>
            </div>

            <!-- Favorites Section -->
            <section class="mb-8" *ngIf="favoriteTools.length > 0">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Mis favoritos</h2>
                <div class="bg-white rounded-xl p-6 border border-gray-200">
                    <div class="flex items-center gap-3 text-gray-500">
                        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                        </svg>
                        <div>
                            <p class="font-medium text-gray-900">¡Tus herramientas favoritas aquí!</p>
                            <p class="text-sm">Haz clic en la estrella de una herramienta y guárdala añádela.</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Tools Section -->
            <section>
                <h2 class="text-xl font-bold text-gray-900 mb-4">Nuestras herramientas</h2>

                <!-- Category Filters -->
                <app-category-filter [categories]="categories" [selectedCategory]="selectedCategory"
                    (select)="selectCategory($event)">
                </app-category-filter>

                <!-- Tools Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <app-tool-card *ngFor="let tool of filteredTools" [tool]="tool"
                        (toggleFavorite)="toggleFavorite($event)">
                    </app-tool-card>
                </div>
            </section>
        </div>
    </main>
</div>
