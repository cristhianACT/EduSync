<div class="bg-white rounded-xl p-6 border border-gray-200 hover:shadow-xl transition-all cursor-pointer group h-full">
    <div class="flex items-start justify-between mb-4">
        <div [class.bg-blue-100]="tool.color === 'blue'" [class.bg-purple-100]="tool.color === 'purple'"
            [class.bg-pink-100]="tool.color === 'pink'" [class.bg-green-100]="tool.color === 'green'"
            [class.bg-orange-100]="tool.color === 'orange'"
            class="w-12 h-12 rounded-lg flex items-center justify-center">

            <svg [class.text-blue-600]="tool.color === 'blue'" [class.text-purple-600]="tool.color === 'purple'"
                [class.text-pink-600]="tool.color === 'pink'" [class.text-green-600]="tool.color === 'green'"
                [class.text-orange-600]="tool.color === 'orange'" class="w-6 h-6" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">

                <!-- Icon: Document (Default / Fallback) -->
                <path *ngIf="tool.icon === 'document' || !tool.icon" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

                <!-- Other icons would go here, reusing document for now as paths were missing in original -->
                <path *ngIf="tool.icon === 'calendar'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                <!-- Guessing a calendar path or just standard icon -->

            </svg>
        </div>
        <button (click)="toggleFavorite.emit(tool); $event.stopPropagation()"
            class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
            <svg [class.fill-yellow-400]="tool.isFavorite" [class.stroke-yellow-400]="tool.isFavorite"
                [class.fill-none]="!tool.isFavorite" class="w-5 h-5 text-gray-400" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
        </button>
    </div>
    <div class="mb-2">
        <span [class.bg-blue-100]="tool.color === 'blue'" [class.text-blue-700]="tool.color === 'blue'"
            [class.bg-purple-100]="tool.color === 'purple'" [class.text-purple-700]="tool.color === 'purple'"
            [class.bg-pink-100]="tool.color === 'pink'" [class.text-pink-700]="tool.color === 'pink'"
            [class.bg-green-100]="tool.color === 'green'" [class.text-green-700]="tool.color === 'green'"
            [class.bg-orange-100]="tool.color === 'orange'" [class.text-orange-700]="tool.color === 'orange'"
            class="inline-block px-3 py-1 rounded-full text-xs font-medium">
            {{ tool.category }}
        </span>
    </div>
    <h3 class="font-bold text-gray-900 mb-2 group-hover:text-indigo-600 transition-colors">{{
        tool.name }}</h3>
    <p class="text-sm text-gray-600">{{ tool.description }}</p>
</div>
