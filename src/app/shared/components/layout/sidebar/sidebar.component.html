<aside
  [class.w-64]="isOpen"
  [class.w-20]="!isOpen"
  class="bg-white border-r border-gray-200 transition-all duration-300 flex flex-col h-full"
>
  <!-- Logo -->
  <div class="p-6 border-b border-gray-200">
    <div class="flex items-center gap-3">
      <img src="/assets/image/logos/logo.svg" alt="EduSync Logo" class="w-10 h-10 object-contain" />
      <span *ngIf="isOpen" class="font-bold text-xl text-gray-800">EduSync</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-4 space-y-1">
    <h3 *ngIf="isOpen" class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
      Creación</h3>

    <a *ngFor="let item of menuItems" [routerLink]="item.route" [class.bg-indigo-50]="item.active"
      [class.text-indigo-600]="item.active" [class.text-gray-600]="!item.active"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        <path *ngIf="item.icon === 'tools'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        <path *ngIf="item.icon === 'chat'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        <path *ngIf="item.icon === 'folder'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        <path *ngIf="item.icon === 'users'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span *ngIf="isOpen" class="font-medium">{{ item.label }}</span>
    </a>

    <div *ngIf="isOpen" class="pt-6">
      <h3 class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Conoce más</h3>
      <a *ngFor="let item of moreMenuItems" [routerLink]="item.route"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
        </svg>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    </div>
  </nav>

  <!-- User Profile -->
  <div class="p-4 border-t border-gray-200">
    <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 cursor-pointer">
      <div
        class="w-10 h-10 bg-gradient-to-br from-orange-400 to-pink-500 rounded-full flex items-center justify-center text-white font-semibold">
        {{ getUserInitials() }}
      </div>
      <div *ngIf="isOpen" class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900 truncate">{{ userName }}</p>
        <p class="text-xs text-gray-500">5 Kalipuntos</p>
      </div>
    </div>
  </div>
</aside>
