<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

    <!-- Modal Container -->
    <div
        class="relative bg-white rounded-3xl w-full max-w-5xl h-[85vh] flex shadow-2xl overflow-hidden animate-fade-in-up">

        <!-- Close Button (Absolute top right) -->
        <button (click)="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600 z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <!-- Sidebar -->
        <div class="w-64 bg-gray-50/50 p-6 flex flex-col border-r border-gray-100/50">
            <div class="space-y-1 flex-1">
                <button *ngFor="let item of menuItems" (click)="setActiveTab(item.label)"
                    [class.bg-white]="activeTab === item.label" [class.shadow-sm]="activeTab === item.label"
                    [class.font-semibold]="activeTab === item.label" [class.text-gray-900]="activeTab === item.label"
                    [class.text-gray-500]="activeTab !== item.label"
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-white hover:text-gray-900 hover:shadow-sm text-left text-sm">
                    <!-- Icons would go here based on item.icon -->
                    <svg *ngIf="item.label === 'Perfil'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <svg *ngIf="item.label === 'Personalización'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
                        </path>
                    </svg>
                    <svg *ngIf="item.label === 'Profesión'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                        </path>
                    </svg>
                    <svg *ngIf="item.label === 'Suscripción'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                        </path>
                    </svg>
                    <svg *ngIf="item.label === 'Cuenta'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <svg *ngIf="item.label === 'Mis Certificados'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    {{ item.label }}
                </button>
            </div>

            <button
                class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-gray-900 transition-colors text-sm font-medium mt-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Cerrar Sesión
            </button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-12 overflow-y-auto">
            <!-- Perfil Tab -->
            <div *ngIf="activeTab === 'Perfil'" class="max-w-2xl animate-fade-in-up">
                <h2 class="text-3xl font-bold text-slate-800 mb-2 font-display">Editar perfil</h2>
                <p class="text-slate-500 mb-10">Mantén privados tus datos personales.</p>

                <div class="space-y-8">

                    <!-- Profile Photo -->
                    <div class="flex items-center gap-8">
                        <label class="w-32 text-gray-700 font-medium">Foto de perfil</label>
                        <div class="relative group cursor-pointer">
                            <div
                                class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center overflow-hidden border-2 border-slate-100 hover:border-indigo-400 transition-colors">
                                <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix" alt="Avatar"
                                    class="w-full h-full object-cover">
                            </div>
                            <div
                                class="absolute inset-0 bg-black/20 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Form Fields -->
                    <div class="grid gap-6">

                        <div class="grid grid-cols-[120px_1fr] gap-6 items-center">
                            <label class="text-gray-700 font-medium">País</label>
                            <select
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 bg-white text-gray-700">
                                <option>Perú</option>
                                <option>México</option>
                                <option>Argentina</option>
                                <option>Colombia</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-[120px_1fr] gap-6 items-center">
                            <label class="text-gray-700 font-medium">Nombres</label>
                            <input type="text" value="Hellowda"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-700">
                        </div>

                        <div class="grid grid-cols-[120px_1fr] gap-6 items-center">
                            <label class="text-gray-700 font-medium">Apellidos</label>
                            <input type="text" value="PRROS"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-700">
                        </div>

                        <div class="grid grid-cols-[120px_1fr] gap-6 items-center">
                            <label class="text-gray-700 font-medium">Teléfono</label>
                            <input type="tel" value="968797822"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-700">
                        </div>

                        <div class="grid grid-cols-[120px_1fr] gap-6 items-center">
                            <label class="text-gray-700 font-medium">Correo</label>
                            <input type="email" value="cartalle72000@gmail.com"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-700">
                        </div>

                    </div>

                    <!-- Save Button -->
                    <div class="flex justify-end pt-6">
                        <button
                            class="bg-[#ff7b7b] hover:bg-[#ff6161] text-white px-8 py-3 rounded-lg font-semibold shadow-lg shadow-red-500/20 transform hover:-translate-y-0.5 transition-all">
                            Guardar
                        </button>
                    </div>

                </div>
            </div>

            <!-- Profesión Tab -->
            <div *ngIf="activeTab === 'Profesión'" class="max-w-2xl animate-fade-in-up">
                <h2 class="text-3xl font-bold text-slate-800 mb-2 font-display">Edita tu profesión</h2>
                <p class="text-slate-500 mb-10">Edita la personalización de tu cuenta.</p>

                <div class="space-y-8">
                    <div class="grid gap-6">

                        <!-- Colegio -->
                        <div class="grid grid-cols-[140px_1fr] gap-6 items-center">
                            <label class="text-gray-800 font-medium">Colegio</label>
                            <input type="text" placeholder="Escribe tu nombre"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-900 placeholder:text-gray-400">
                        </div>

                        <!-- Nivel Educativo -->
                        <div class="grid grid-cols-[140px_1fr] gap-6 items-center">
                            <label class="text-gray-800 font-medium">Nivel Educativo</label>
                            <input type="text" placeholder="Escribe tu nombre"
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-900 placeholder:text-gray-400">
                        </div>

                        <!-- Asignatura -->
                        <div class="grid grid-cols-[140px_1fr] gap-6 items-center">
                            <label class="text-gray-800 font-medium">Asignatura</label>
                            <input type="text" placeholder="Type here..."
                                class="w-full px-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-gray-900 placeholder:text-gray-400">
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
