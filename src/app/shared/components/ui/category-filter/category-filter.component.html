<div class="flex flex-wrap gap-2 mb-6">
    <button *ngFor="let category of categories" (click)="select.emit(category.id)"
        [class.bg-gray-900]="selectedCategory === category.id"
        [class.text-white]="selectedCategory === category.id"
        [class.bg-white]="selectedCategory !== category.id"
        [class.text-gray-700]="selectedCategory !== category.id"
        class="px-4 py-2 rounded-full border border-gray-300 font-medium hover:shadow-md transition-all">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            {{ category.label }}
        </span>
    </button>
</div>
